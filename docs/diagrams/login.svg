<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Diagrama de secuencia de inicio de sesión: la aplicación móvil envía usuario y contraseña a Mobile Alert API, que busca la institución y, según tenga o no autenticación delegada, valida contra el backend del cuartel o localmente, devolviendo un token JWT.">
  <style>
    :root {
      --bg: #FBF8F6;
      --surface: #FFFFFF;
      --surface-2: #F4EEEA;
      --border: #E7DED8;
      --text: #2A1E1B;
      --text-muted: #7C6D64;
      --accent: #AB2118;
      --accent-soft: #F4DAD7;
      --accent2: #1E3A6E;
      --accent2-soft: #DCE3F0;
      --infra: #64594F;
      --infra-soft: #EAE3DA;
    }
    svg { color: var(--text); font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
    text { fill: currentColor; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .lifeline { stroke: currentColor; stroke-opacity: 0.28; stroke-width: 1.5; stroke-dasharray: 3 4; }
    .msg-line { stroke: currentColor; stroke-width: 1.6; fill: none; }
    .msg-line.dashed { stroke-dasharray: 6 4; }
    .msg-label { font-size: 12.5px; }
    .msg-label.mono { font-size: 11.5px; }
    .box-label { font-size: 13px; font-weight: 600; }
    .sub-label { font-size: 10.5px; fill: var(--text-muted); }
    .frame { fill: none; stroke: currentColor; stroke-opacity: 0.4; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .frame-tag { font-size: 10.5px; font-weight: 600; letter-spacing: 0.03em; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="399" rx="14" fill="var(--surface)" stroke="var(--border)"/>

        <!-- participants -->
        <g class="mono">
          <rect x="20"  y="20" width="150" height="44" rx="9" fill="var(--surface-2)" stroke="currentColor" stroke-opacity="0.5"/>
          <text x="95" y="47" text-anchor="middle" class="box-label">Aplicación móvil</text>

          <rect x="355" y="20" width="170" height="44" rx="9" fill="var(--accent)" stroke="var(--accent)"/>
          <text x="440" y="47" text-anchor="middle" class="box-label" fill="#fff">Mobile Alert API</text>

          <rect x="605" y="20" width="150" height="44" rx="9" fill="var(--accent2-soft)" stroke="var(--accent2)"/>
          <text x="680" y="41" text-anchor="middle" class="box-label" fill="var(--accent2)">Backend del</text>
          <text x="680" y="55" text-anchor="middle" class="box-label" fill="var(--accent2)">cuartel (opcional)</text>

          <rect x="800" y="20" width="80" height="44" rx="9" fill="var(--infra-soft)" stroke="var(--infra)"/>
          <text x="840" y="47" text-anchor="middle" class="box-label" fill="var(--infra)">Datos</text>
        </g>

        <line x1="95" y1="64" x2="95" y2="380" class="lifeline"/>
        <line x1="440" y1="64" x2="440" y2="380" class="lifeline"/>
        <line x1="680" y1="64" x2="680" y2="380" class="lifeline"/>
        <line x1="840" y1="64" x2="840" y2="380" class="lifeline"/>

        <line x1="95" y1="100" x2="434" y2="100" class="msg-line" marker-end="url(#arrow)"/>
        <text x="265" y="92" text-anchor="middle" class="msg-label mono">POST /api/auth/login</text>

        <line x1="440" y1="140" x2="834" y2="140" class="msg-line" marker-end="url(#arrow)"/>
        <text x="640" y="132" text-anchor="middle" class="msg-label">buscar institución</text>

        <!-- alt frame -->
        <rect x="60" y="172" width="790" height="164" class="frame"/>
        <path d="M60,172 h64 v16 l-10,10 h-54 z" fill="var(--surface-2)" stroke="currentColor" stroke-opacity="0.4"/>
        <text x="72" y="188" class="frame-tag">alt</text>
        <line x1="60" y1="256" x2="850" y2="256" class="frame" stroke-dasharray="4 3"/>

        <text x="220" y="196" class="sub-label">institución con autenticación delegada</text>
        <line x1="440" y1="210" x2="674" y2="210" class="msg-line" marker-end="url(#arrow)"/>
        <text x="557" y="204" text-anchor="middle" class="msg-label">validar credenciales</text>
        <line x1="674" y1="228" x2="446" y2="228" class="msg-line dashed" marker-end="url(#arrow)"/>
        <text x="557" y="222" text-anchor="middle" class="msg-label">nombre / id externo</text>

        <text x="220" y="272" class="sub-label">institución con autenticación local</text>
        <line x1="440" y1="288" x2="834" y2="288" class="msg-line" marker-end="url(#arrow)"/>
        <text x="640" y="282" text-anchor="middle" class="msg-label">validar contraseña (BCrypt)</text>

        <line x1="440" y1="360" x2="101" y2="360" class="msg-line dashed" marker-end="url(#arrow)"/>
        <text x="265" y="352" text-anchor="middle" class="msg-label">token JWT, datos del bombero, institución</text>
      
</svg>
